spring.application.name=subsidy-tracking

# Datasource Configuration: use H2 by default, with environment overrides for MySQL or other databases
spring.datasource.url=${DB_URL:jdbc:h2:mem:subsidydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (for debugging / development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=${JWT_SECRET:your_jwt_secret_key_government_subsidy_tracking_system_2026_super_secure}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server Port
server.port=${SERVER_PORT:8080}
